spring.application.name=mango-trading

# PostgreSQL - Banco principal (overridable via env for Docker)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mango_trading}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT (overridable via env)
jwt.secret=${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Server port (overridable)
server.port=${SERVER_PORT:8080}

# Jackson - datas ISO8601 desabilitado temporariamente para compat Boot 4.1 / Jackson 3
# Será reativado com config Java (JacksonConfig) em vez de properties
