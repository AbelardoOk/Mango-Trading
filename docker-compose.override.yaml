# docker-compose.override.yaml — dev mode (auto-merged with docker-compose.yaml)
# Usage: docker compose up --build          (dev, with hot-reload)
#        docker compose -f docker-compose.yaml up --build   (prod without override)

services:
  server:
    build:
      target: builder
    volumes:
      - ./server/src:/app/src:ro
      - ./server/pom.xml:/app/pom.xml:ro
      - ./server/.mvn:/app/.mvn:ro
      - ./server/mvnw:/app/mvnw:ro
      - server-m2:/root/.m2
    command: ./mvnw spring-boot:run -Dspring-boot.run.jvmArguments="-Dspring.devtools.restart.enabled=true"
    environment:
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_PROFILES_ACTIVE: dev
    # dev exposes same 8080; no rebuild needed for code change (devtools restart)

  web:
    image: oven/bun:1.3.6
    working_dir: /app
    command: bun run dev
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      NEXT_TELEMETRY_DISABLED: 1
    # bun dev hot-reload + Tailwind watch
    # web talks to server via localhost:8080 (browser) — no internal http://server:8080

  # db stays same in dev (pgdata persisted)

volumes:
  server-m2:
