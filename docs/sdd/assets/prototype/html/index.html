<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mango Trading · Protótipo navegável</title>
<style>
:root{--ink:#172e27;--green:#174f3d;--orange:#f5ac45;--bg:#f5f7f3;--soft:#e8f1eb;--muted:#596b63;--line:#d4dfd7;--red:#ad342c}*{box-sizing:border-box}body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:4px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #a95700}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}a{color:var(--green)}h1,h2,h3,p{margin:0}h1{font-size:34px;line-height:1.2;letter-spacing:-1px}h2{font-size:23px;line-height:1.3;letter-spacing:-.5px}h3{font-size:17px}.muted{color:var(--muted)}.small{font-size:13px;line-height:1.6}.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.5px}.positive{color:var(--green)}.negative{color:var(--red)}.stack{display:flex;flex-direction:column;gap:20px}.row{display:flex;align-items:center;gap:16px}.spread{justify-content:space-between}.btn{border:0;background:var(--green);color:white;min-height:48px;padding:12px 23px;border-radius:10px;font-weight:650;font-size:14px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;gap:10px}.btn:hover{filter:brightness(.94)}.btn.secondary{background:var(--soft);color:var(--green)}.btn.danger{background:var(--red)}.btn.subtle{background:transparent;color:var(--green)}.full{width:100%}.pill{font-size:12px;border-radius:100px;padding:6px 11px;display:inline-block;font-weight:600;background:var(--soft);color:var(--green)}.pill.warn{background:#fff0d6;color:#7b4a00}.pill.red{background:#fbece9;color:var(--red)}.card{background:white;border-radius:17px;padding:25px}.card.dark{background:var(--ink);color:white}.card.soft{background:var(--soft)}.grid{display:grid;gap:24px}.grid.two{grid-template-columns:1.1fr 1fr}.grid.three{grid-template-columns:repeat(3,1fr)}.metric{min-height:138px;display:flex;flex-direction:column;gap:7px}.m s:flex-start;gap:10px;line-height:1.5}.check input{width:18px;height:18px;accent-color:var(--green)}.dialogback{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;background:#172e2777}.dialog{max-width:530px;width:100%;box-shadow:0 24px 100px #0003}.dialogicon{font-size:35px;width:64px;height:64px;display:flex;align-items:center;justify-content:center;border-radius:16px;background:#fbece9;color:var(--red)}.successmark{font-size:35px;width:70px;height:70px;background:var(--soft);border-radius:50%;color:var(--green);display:flex;align-items:center;justify-content:center}.successcard{max-width:850px;margin:20px auto 0;width:100%;padding:44px}.toast{position:fixed;bottom:28px;right:28px;background:var(--ink);color:white;padding:18px 24px;border-radius:12px;z-index:130;box-shadow:0 12px 35px #0002}.mobilebar{display:none}.cover{padding:70px;min-height:900px;background:var(--ink);color:white;display:flex;flex-direction:column;justify-content:space-between}.cover h1{font-size:86px;letter-spacing:-3px;max-width:1000px}.cover .kicker{color:var(--orange);letter-spacing:3px;font-size:13px}.cover p{max-width:850px;color:#c7d7cc;font-size:21px;line-height:1.6}.spec{padding:48px 60px;min-height:900px;display:flex;flex-direction:column;gap:24px}.spec p,.spec li{font-size:15px;line-height:1.6}.spec li{margin:6px 0}.spec ul{padding-left:22px;margin:0}.spec .grid.two{grid-template-columns:1fr 1fr}.skip{position:fixed;top:-80px;left:245px;background:white;padding:14px;z-index:200}.skip:focus{top:10px}.hidden{display:none!important}.blank{padding:45px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:20px}.adminbadge{font-size:12px;background:#fff0d6;color:#754600;padding:6px 10px;border-radius:6px}.datecell{font-variant-numeric:tabular-nums}.demohead{background:#e8f1eb;color:var(--green);padding:8px 14px;font-size:12px;text-align:center}.rootdemo{display:none}body[data-export=true] .toast{display:none}

</style></head><body><a class="skip" href="#main">Pular para o conteúdo</a><div id="app"></div><div id="live" role="status" aria-live="polite"></div>
<script>
const initialStocks=[{symbol:'AURA3',name:'Aurora Energia',sector:'Energia',price:42,change:2.44,volatility:1.8,active:true,description:'Empresa fictícia dedicada à geração de energia renovável e à distribuição de soluções sustentáveis.'},{symbol:'NEXO3',name:'Nexo Tecnologia',sector:'Tecnologia',price:65,change:1.56,volatility:2.4,active:true,description:'Soluções fictícias de software e infraestrutura digital.'},{symbol:'VERD3',name:'Verde Agro',sector:'Agronegócio',price:31.5,change:-.98,volatility:1.5,active:true,description:'Produção agrícola fictícia com foco em inovação e sustentabilidade.'},{symbol:'BRIS3',name:'Brisa Logística',sector:'Logística',price:24.8,change:.81,volatility:1.2,active:true,description:'Operações fictícias de transporte e distribuição.'}];
let stocks=structuredClone(initialStocks),balance=4200,portfolio=[{symbol:'AURA3',qty:80,avg:40},{symbol:'NEXO3',qty:66,avg:61},{symbol:'VERD3',qty:20,avg:32}],transactions=[{date:'13/09/2026 · 16:08',type:'Venda',symbol:'AURA3',qty:5,price:41},{date:'12/09/2026 · 11:20',type:'Compra',symbol:'NEXO3',qty:20,price:61},{date:'11/09/2026 · 09:42',type:'Compra',symbol:'VERD3',qty:20,price:32}],selected='AURA3',page='login',modal=false,lastTrade=null,notice='',historyFilter='Todas';
const money=n=>'M$ '+Number(n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(label,action,cls='',extra='')=>`<button class="btn ${cls}" onclick="${action}" ${extra}>${label}</button>`;
const field=(label,id,value='',type='text',help='')=>`<label class="field" for="${id}">${label}<input id="${id}" name="${id}" type="${type}" value="${esc(value)}" ${help?`aria-describedby="${id}-help"`:''}>${help?`<span class="help" id="${id}-help">${help}</span>`:''}</label>`;
function go(p){page=p;modal=p==='delete';notice='';render();window.scrollTo(0,0)}function toast(s){document.getElementById('live').innerHTML=`<div class="toast">${esc(s)}</div>`;setTimeout(()=>document.getElementById('live').innerHTML='',3500)}
function total(){return balance+portfolio.reduce((a,p)=>a+p.qty*(stocks.find(s=>s.symbol===p.symbol)?.price||0),0)}
function shell(title,subtitle,content,active='dashboard',admin=false){const nav=admin?[['admin','Ações e empresas'],['events','Eventos de mercado'],['users','Usuários']]:[['dashboard','Visão geral'],['market','Mercado'],['wallet','Minha carteira'],['history','Histórico'],['ranking','Ranking']];return `<aside class="side"><div><div class="logo">mango.</div><div class="eyebrow" style="font-size:9px;color:#becfc5;margin-top:13px">TRADING SIMULATOR</div></div><nav aria-label="${admin?'Administração':'Navegação principal'}">${nav.map(([p,l])=>`<button class="${active===p?'active':''}" onclick="go('${p}')" ${active===p?'aria-current="page"':''}>${l}</button>`).join('')}</nav><div class="sidefoot"><p class="small" style="color:#becfc5">100% VIRTUAL<br>Empresas fictícias.<br>Aprendizado real.</p><button onclick="go('${admin?'dashboard':'guide'}')">${admin?'← Área do jogador':'Guia do protótipo'}</button><button onclick="go('login')">Sair da conta</button></div></aside><main class="main" id="main" tabindex="-1"><header class="topbar"><span class="eyebrow">${admin?'ADMINISTRAÇÃO / ACESSO RESTRITO':'ÁREA DO JOGADOR'}</span><span class="small user">${admin?'<span class="adminbadge">Administrador</span>':'Giovana · Jogadora'}</span></header><div class="pagehead"><h1>${title}</h1><p>${subtitle}</p></div>${notice?`<div class="alert ok" role="status">${esc(notice)}</div>`:''}${content}</main><nav class="mobilebar" aria-label="Navegação móvel">${nav.map(([p,l])=>`<button class="${active===p?'active':''}" onclick="go('${p}')">${l.replace('Minha ','').replace('Visão geral','Início')}</button>`).join('')}</nav>`}
function chart(){return `<svg class="chart" viewBox="0 0 680 168" preserveAspectRatio="none" role="img" aria-label="Evolução ilustrativa do patrimônio, de 10 mil a 12.480 moedas virtuais em sete dias"><path d="M0 25H680M0 78H680M0 133H680" stroke="#e4eae5" fill="none"/><path d="M0 145 L80 119 L150 128 L210 94 L280 104 L350 71 L420 80 L480 42 L550 57 L620 22 L680 8 L680 165 L0 165Z" fill="#e8f1eb"/><path d="M0 145 L80 119 L150 128 L210 94 L280 104 L350 71 L420 80 L480 42 L550 57 L620 22 L680 8" fill="none" stroke="#174f3d" stroke-width="4" stroke-linejoin="round"/></svg>`}
function dashboard(){return shell('Seu próximo movimento começa aqui.','Acompanhe seu patrimônio e explore o mercado fictício.',`<section class="grid three" aria-label="Resumo financeiro">${[['Patrimônio total',money(total()),'+24,80% desde o início','dark'],['Saldo disponível',money(balance),'Pronto para novas operações',''],['Valor das ações',money(total()-balance),'3 empresas na sua carteira','']].map(([l,v,d,c])=>`<article class="card metric ${c}"><span class="label">${l}</span><strong class="value">${v}</strong><span class="small ${c?'positive':'muted'}">${d}</span></article>`).join('')}</section><section class="grid" style="grid-template-columns:minmax(0,1.95fr) minmax(270px,1fr)" id="dashcharts"><article class="card stack"><h3>Evolução do patrimônio</h3><p class="small muted">Últimos 7 dias · Valores em moeda virtual (M$)</p>${chart()}<div class="chartlabels"><span>08 set</span><span>09 set</span><span>10 set</span><span>11 set</span><span>12 set</span><span>14 set</span></div></article><article class="card soft stack"><span class="eyebrow positive">SEU LUGAR NO JOGO</span><h1 style="font-size:39px">4º lugar</h1><p class="small muted">Você está entre os 10 melhores.<br>Explore as estratégias dos jogadores.</p>${btn('Ver ranking →',"go('ranking')",'full')}</article></section><section class="card row spread responsive"><div class="stack" style="gap:7px"><h3>O mercado está em movimento.</h3><p class="muted small">Descubra empresas e encontre sua próxima ação.</p></div>${btn('Explorar mercado →',"go('market')")}</section>`)}
function stockid(s){return `<div class="stock"><span class="avatar">${esc(s.symbol.slice(0,2))}</span><div><strong>${esc(s.name)}</strong><span class="small muted">${esc(s.symbol)} · ${esc(s.sector)}</span></div></div>`}
function variation(s){return `<span class="${s.change>=0?'positive':'negative'}">${s.change>=0?'↑ +':'↓ −'}${Math.abs(s.change).toFixed(2).replace('.',',')}%</span>`}
function market(){const rows=stocks.filter(s=>s.active);return shell('Mercado de ações','Explore empresas fictícias e encontre seu próximo movimento.',`<div class="filters">${field('Buscar empresa ou símbolo','search','','search')}<label class="field" style="max-width:300px">Setor<select id="sector"><option>Todos os setores</option>${[...new Set(stocks.map(s=>s.sector))].map(s=>`<option>${esc(s)}</option>`).join('')}</select></label></div><section class="card datawrap desktoponly"><table class="data"><thead><tr><th>EMPRESA / SÍMBOLO</th><th>PREÇO ATUAL</th><th>VARIAÇÃO (DIA)</th><th>AÇÃO</th></tr></thead><tbody id="marketrows">${rows.map(s=>`<tr data-search="${esc((s.name+' '+s.symbol).toLowerCase())}" data-sector="${s.sector}"><td>${stockid(s)}</td><td><strong>${money(s.price)}</strong></td><td>${variation(s)}</td><td>${btn('Negociar →',`selected='${s.symbol}';go('buy')`,'secondary mini')}</td></tr>`).join('')}</tbody></table><p id="noresults" class="hidden small muted" style="padding:30px 0">Nenhuma empresa encontrada. Tente outro termo ou setor.</p></section><section class="mobileonly mobilecards">${rows.map(s=>`<article class="card stocktile" data-search="${esc((s.name+' '+s.symbol).toLowerCase())}" data-sector="${s.sector}">${stockid(s)}<div class="row spread"><strong>${money(s.price)}</strong>${variation(s)}</div>${btn('Negociar →',`selected='${s.symbol}';go('buy')`,'secondary full')}</article>`).join('')}</section><p class="small muted">Todas as empresas e cotações são fictícias. As operações usam somente saldo virtual.</p>`,'market')}
function trade(sell=false,error=false){const s=stocks.find(s=>s.symbol===selected),pos=portfolio.find(p=>p.symbol===selected),qty=error?1000:10;return shell(sell?'Vender ações':'Comprar ações',`Mercado / ${esc(s.name)} / ${sell?'Venda':'Compra'} simulada`,`<div class="grid two"><section class="card stack"><div class="row spread"><span class="pill">${esc(s.symbol)} · ${esc(s.sector.toUpperCase())}</span><span class="small muted">Empresa fictícia</span></div><h2 style="font-size:29px">${esc(s.name)}</h2><div><div class="detailprice">${money(s.price)}</div>${variation(s)} <span class="small muted">hoje</span></div>${chart()}<p class="muted small">${esc(s.description)}</p><hr class="divider"><p class="small"><strong>NA SUA CARTEIRA</strong><br>${pos?.qty||0} ações · Preço médio: ${money(pos?.avg||0)}</p></section><section class="card stack"><div class="tabs" aria-label="Tipo da operação"><button class="${!sell?'active':''}" onclick="go('buy')">Comprar</button><button class="${sell?'active':''}" onclick="go('sell')">Vender</button></div><h2>${sell?'Nova venda':'Nova compra'}</h2><form id="tradeform" class="stack"><label class="field" for="qty">Quantidade de ações<input id="qty" name="qty" type="number" min="1" step="1" value="${qty}" aria-describedby="qtyhelp tradeerror"><span class="help" id="qtyhelp">${sell?`Você possui ${pos?.qty||0} ações disponíveis.`:'Informe uma quantidade inteira maior que zero.'}</span></label><div id="tradeerror" class="alert error ${error?'':'hidden'}" role="alert">Saldo insuficiente. Reduza a quantidade para continuar.</div><div class="summary"><div><span class="muted">Preço unitário</span><strong>${money(s.price)}</strong></div><div><span class="muted">Saldo disponível</span><span>${money(balance)}</span></div><div class="total"><span>Total da ${sell?'venda':'compra'}</span><span id="tradetotal">${money(s.price*qty)}</span></div><div><span class="muted">Saldo após a operação</span><strong id="tradebalance">${!sell&&s.price*qty>balance?'—':money(balance+(sell?1:-1)*s.price*qty)}</strong></div></div><button id="confirmtrade" class="btn full" type="submit">Confirmar ${sell?'venda':'compra'}</button><p class="small muted">Esta operação usa somente dinheiro virtual. Confira a quantidade antes de confirmar.</p></form></section></div>`,'market')}
function executeTrade(sell){let q=Number(document.getElementById('qty').value),s=stocks.find(s=>s.symbol===selected),p=portfolio.find(x=>x.symbol===selected),amount=Math.round(q*s.price*100)/100,error='';if(!Number.isInteger(q)||q<=0)error='Informe uma quantidade inteira maior que zero.';else if(!s.active)error='Esta ação está desativada para negociação.';else if(sell&&q>(p?.qty||0))error='Quantidade indisponível. Você não pode vender mais ações do que possui.';else if(!sell&&amount>balance)error='Saldo insuficiente. Reduza a quantidade para continuar.';if(error){document.getElementById('tradeerror').textContent=error;document.getElementById('tradeerror').classList.remove('hidden');document.getElementById('qty').setAttribute('aria-invalid','true');return}if(sell){balance+=amount;p.qty-=q;portfolio=portfolio.filter(x=>x.qty>0)}else{balance-=amount;if(p){p.avg=(p.avg*p.qty+amount)/(p.qty+q);p.qty+=q}else portfolio.push({symbol:selected,qty:q,avg:s.price})}lastTrade={date:'14/09/2026 · 10:32',type:sell?'Venda':'Compra',symbol:selected,qty:q,price:s.price};transactions.unshift(lastTrade);go('success')}
function success(){const t=lastTrade||{type:'Compra',symbol:'AURA3',qty:10,price:42,date:'14/09/2026 · 10:32'},p=portfolio.find(x=>x.symbol===t.symbol);return shell(`${t.type} concluída`,'Seu saldo e sua carteira foram atualizados.',`<section class="card stack successcard"><div class="successmark">✓</div><span class="eyebrow positive">OPERAÇÃO CONCLUÍDA</span><h1>${t.qty} ações ${t.type==='Compra'?'adicionadas à':'vendidas da'} sua carteira.</h1><p class="muted">${t.symbol} · ${t.date}</p><div class="summary"><div><span>Total da operação</span><strong>${money(t.qty*t.price)}</strong></div><div><span>Saldo disponível</span><strong>${money(balance)}</strong></div><div><span>Sua posição em ${t.symbol}</span><strong>${p?.qty||0} ações</strong></div><div><span>Preço médio</span><strong>${money(p?.avg||0)}</strong></div></div><div class="row responsive">${btn('Ver minha carteira',"go('wallet')")}${btn('Voltar ao mercado',"go('market')",'secondary')}</div></section>`,'market')}
function wallet(empty=false){return shell('Minha carteira','Acompanhe suas posições e a evolução do seu patrimônio.',`<div class="grid three">${[['Patrimônio total',total()],['Saldo disponível',balance],['Valor das ações',total()-balance]].map(([l,v],i)=>`<section class="card metric ${i===0?'dark':''}"><span class="label">${l}</span><strong class="value">${money(v)}</strong></section>`).join('')}</div>${empty?`<section class="card blank"><span class="successmark">↗</span><h2>Sua primeira ação espera por você.</h2><p class="muted">Explore o mercado para começar sua carteira virtual.</p>${btn('Explorar mercado',"go('market')")}</section>`:`<section class="card datawrap"><table class="data"><thead><tr><th>ATIVO</th><th>QTD.</th><th>PREÇO MÉDIO</th><th>ATUAL</th><th>VALOR ATUAL</th><th>RESULTADO</th><th></th></tr></thead><tbody>${portfolio.map(p=>{const s=stocks.find(s=>s.symbol===p.symbol),result=(s.price-p.avg)*p.qty;return `<tr><td><strong>${s.symbol}</strong><br><span class="small muted">${esc(s.name)}</span></td><td>${p.qty}</td><td>${money(p.avg)}</td><td>${money(s.price)}</td><td><strong>${money(s.price*p.qty)}</strong></td><td class="${result>=0?'positive':'negative'}">${result>=0?'+':'−'}${money(Math.abs(result))}</td><td>${btn('Vender',`selected='${s.symbol}';go('sell')`,'secondary mini')}</td></tr>`}).join('')}</tbody></table></section>`}<p class="small muted">Patrimônio total = saldo disponível + valor atual de todas as ações.<br>Resultado por ativo = (preço atual − preço médio) × quantidade.</p>`,'wallet')}
function history(){const rows=transactions.filter(t=>historyFilter==='Todas'||t.type===historyFilter);return shell('Histórico de transações','Consulte os registros das suas compras e vendas.',`<div class="filters"><label class="field" style="max-width:300px">Tipo de operação<select id="historytype">${['Todas','Compra','Venda'].map(t=>`<option ${historyFilter===t?'selected':''}>${t}</option>`).join('')}</select></label><div class="field" style="justify-content:end"><span class="small muted">${rows.length} registros · Horários de exemplo</span></div></div><section class="card datawrap"><table class="data"><thead><tr><th>DATA E HORA</th><th>OPERAÇÃO</th><th>ATIVO</th><th>QTD.</th><th>PREÇO</th><th>TOTAL</th></tr></thead><tbody>${rows.map(t=>`<tr><td class="datecell">${t.date}</td><td><span class="pill ${t.type==='Venda'?'warn':''}">${t.type}</span></td><td><strong>${t.symbol}</strong></td><td>${t.qty}</td><td>${money(t.price)}</td><td><strong>${money(t.qty*t.price)}</strong></td></tr>`).join('')}</tbody></table></section><p class="small muted">As transações preservam o preço e a quantidade do momento da operação.</p>`,'history')}

function auth(signup=false){return `<main class="auth" id="main"><section class="authhero"><div class="logo">mango.</div><span class="eyebrow" style="color:#c7d7cc">SEU PRIMEIRO PASSO NO MERCADO</span><h1>Aprenda.<br>Negocie.<br><span style="color:var(--orange)">Evolua.</span></h1><p class="pitch">Um mercado fictício para testar suas decisões, construir sua carteira e aprender na prática.</p><svg class="heroart" viewBox="0 0 550 200" aria-hidden="true"><rect x="20" y="120" width="80" height="80" rx="12" fill="#315446"/><rect x="130" y="83" width="80" height="117" rx="12" fill="#4f7659"/><rect x="240" y="47" width="80" height="153" rx="12" fill="#8ca479"/><rect x="350" y="8" width="80" height="192" rx="12" fill="#f5ac45"/><path d="M35 92L160 57L275 22L396 0" fill="none" stroke="#f5ac45" stroke-width="4"/></svg><span class="foot">100% virtual · Empresas fictícias · Aprendizado real</span></section><section class="authform"><form id="authform"><span class="eyebrow positive">${signup?'COMECE SUA JORNADA':'BEM-VINDO DE VOLTA'}</span><h1>${signup?'Crie sua conta.':'O mercado espera por você.'}</h1><p class="muted small">${signup?'Crie seu perfil de jogador e explore o mercado virtual.':'Entre para acompanhar sua carteira e planejar seu próximo movimento.'}</p>${signup?field('Nome','name','Giovana Pavese'):''}${field('E-mail','email','jogadora@exemplo.com','email')}${field('Senha','password','mango1234','password',signup?'Sugestão de interface: use pelo menos 8 caracteres.':'')}${signup?field('Confirmar senha','password2','mango1234','password'):''}<div id="autherror" class="alert error hidden" role="alert"></div><button type="submit" class="btn full">${signup?'Criar conta e começar →':'Entrar →'}</button><p class="small">${signup?'Já tem conta?':'Ainda não tem conta?'} <a href="#" onclick="event.preventDefault();go('${signup?'login':'signup'}')">${signup?'Entrar':'Criar conta'}</a></p>${!signup?`<hr class="divider">${btn('Abrir demonstração do administrador',"go('admin')" function saveStock(event,edit){event.preventDefault();const name=document.getElementById('stockname').value.trim(),symbol=document.getElementById('symbol').value.trim().toUpperCase(),sector=document.getElementById('stocksector').value.trim(),price=Number(document.getElementById('price').value),volatility=Number(document.getElementById('volatility').value);let error='';if(!name||!symbol||!sector)error='Preencha nome, símbolo e setor.';else if(!/^[A-Z0-9]{3,10}$/.test(symbol))error='Use de 3 a 10 letras maiúsculas ou números no símbolo.';else if(stocks.some(s=>s.symbol===symbol&&(!edit||s.symbol!==selected)))error='Este símbolo já existe. Use um identificador único.';else if(!Number.isFinite(price)||price<=0)error='Informe um preço maior que zero.';else if(!Number.isFinite(volatility)||volatility<0)error='A volatilidade deve ser um número igual ou maior que zero.';else if(edit&&selected!==symbol&&portfolio.some(p=>p.symbol===selected))error='O símbolo de uma ação com posições existentes deve ser mantido neste protótipo.';if(error){const e=document.getElementById('stockerror');e.textContent=error;e.classList.remove('hidden');return}const data={name,symbol,sector,price:Math.round(price*100)/100,volatility,description:document.getElementById('description').value,active:document.getElementById('status').value==='Ativa',change:0};if(edit)stocks[stocks.findIndex(s=>s.symbol===selected)]=data;else stocks.push(data);page='admin';notice=edit?'Alterações salvas com sucesso.':'Ação cadastrada com sucesso.';render()}

function guide(){return `<main class="spec" id="main"><div class="row spread"><span class="eyebrow positive">MANGO TRADING / GUIA DO PROTÓTIPO</span>${btn('Abrir interface →',"go('login')",'secondary mini')}</div><h1>Uma interface, três perfis de acesso.</h1><p class="muted">Planejamento visual para a atividade de Entrega do Protótipo (Esqueleto).</p><section class="grid three"><article class="card stack"><span class="pill">Visitante</span><h2>Entrar e criar conta</h2><p>Cadastro e autenticação. O cadastro público cria apenas um perfil de usuário comum.</p>${btn('Ver acesso',"go('login')",'secondary')}</article><article class="card stack"><span class="pill">Usuário comum</span><h2>Negociar e acompanhar</h2><p>Mercado, compra, venda, saldo, carteira, histórico, patrimônio e ranking.</p>${btn('Ver jogador',"go('dashboard')",'secondary')}</article><article class="card stack"><span class="pill warn">Administrador</span><h2>Gerenciar o mercado</h2><p>CRUD de ações e empresas, ativação e desativação, eventos e consulta de usuários.</p>${btn('Ver administração',"go('admin')",'secondary')}</article></section><section class="grid two"><article class="card stack"><h2>Fluxos para demonstrar</h2><p><strong>Jogador:</strong> Entrar → Mercado → Comprar → Confirmação → Carteira → Histórico → Ranking.</p><p><strong>CRUD:</strong> Listar → Cadastrar → Editar → Excluir → Confirmar → Retornar à listagem.</p><p><strong>Estados:</strong> saldo insuficiente, quantidade inválida, ação desativada e carteira vazia.</p><div class="row">${btn('Ver erro',"go('error')",'secondary mini')}${btn('Ver estado vazio',"go('empty')",'secondary mini')}</div></article><article class="card stack"><h2>Limites desta demonstração</h2><p>Protótipo local, com dados fictícios em memória. Formulários e navegação simulam os fluxos. Ao recarregar, os dados voltam ao cenário inicial.</p><p>Login, autorização, persistência, ranking dinâmico e motor de preços dependem do back-end. O acesso demonstrativo ao administrador não representa a autenticação final.</p><p>O enunciado cita Canva; a ferramenta solicitada pela equipe foi Figma. As imagens exportadas podem ser anexadas aos slides e à ERS.</p></article></section></main>`}
function accessibility(){return `<main class="spec" id="main"><span class="eyebrow positive">MANGO TRADING / PLANEJAMENTO</span><h1>Acessibilidade e regras de interação.</h1><section class="grid two"><article class="card stack"><h2>Legibilidade e navegação</h2><ul><li>Texto principal verde escuro sobre fundo claro; contraste planejado para WCAG AA.</li><li>Botões com pelo menos 48 px de altura e foco visível.</li><li>Rótulos persistentes nos campos; mensagens de erro textuais.</li><li>Alta e baixa usam setas, sinais e texto, além de cor.</li><li>Desktop com navegação lateral; celular com navegação inferior e lista de ações em cartões.</li></ul></article><article class="card stack"><h2>Planejamento da implementação</h2><ul><li>HTML semântico: header, nav, main, section, form e table.</li><li>ARIA: nomes acessíveis, aria-current, aria-describedby e regiões de status.</li><li>Spring Security autentica e autoriza no servidor; esconder botões não substitui a proteção de rotas.</li><li>JWT na arquitetura REST; senhas com hash; papel definido pelo servidor.</li><li>Persistência real com PostgreSQL; operações de compra e venda atômicas no serviço.</li></ul></article></section><section class="card stack"><h2>Regras adotadas no protótipo</h2><p>Compra exige saldo suficiente e quantidade inteira positiva. Venda exige ações suficientes na carteira. O patrimônio soma saldo e posições a preço atual. Ações desativadas não aceitam novas negociações.</p><p><strong>Decisões propostas para validar com a equipe:</strong> preservar transações ao desativar ações; impedir exclusão com vínculos; valores iniciais e limites de senha são exemplos, pois não estão definidos na ERS.</p></section><section class="card soft"><p><strong>Diferenciais planejados:</strong> gráfico de patrimônio, filtros por setor, eventos de mercado e mensagens claras de resultado. O ranking já integra o MVP e não é tratado como funcionalidade extra.</p></section></main>`}
function coverage(){return `<main class="spec" id="main"><span class="eyebrow positive">MANGO TRADING / RASTREABILIDADE</span><h1>Requisitos representados nas telas.</h1><section class="card datawrap"><table class="data"><thead><tr><th>REQUISITO</th><th>TELA / FLUXO</th><th>EVIDÊNCIA VISUAL</th></tr></thead><tbody>${[['RF01–RF02','Cadastro e login','Campos, rótulos, validação e navegação'],['RF03','Perfis do jogador e administrador','Menus e responsabilidades separados'],['RF04','Listagem, cadastro, edição e exclusão','CRUD completo + ativar/desativar'],['RF05','Mercado de ações','Empresa, símbolo, preço e setor'],['RF06–RF08','Compra, venda e confirmação','Quantidade, total e atualização do saldo'],['RF09–RF11','Carteira, histórico e visão geral','Preço médio, registros e patrimônio'],['RF12','Ranking','Classificação pelo patrimônio total'],['RNF07–RNF08','Desktop, celular e estados','Contraste, foco, rótulos e adaptação']].map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></section><section class="grid two"><article class="card stack"><h2>Atividade de entrega</h2><p>Mockups detalhados, fluxo de CRUD, perfis, planejamento de acessibilidade e diferenciais estão representados neste conjunto.</p></article><article class="card stack"><h2>Itens separados da interface</h2><p>O grupo ainda precisa demonstrar o esqueleto Spring Boot, camadas, segurança e banco; apresentar o diagrama de casos de uso e incluir os integrantes na entrega. Este protótipo não comprova esses itens técnicos.</p></article></section></main>`}
function render(){document.getElementById('app').innerHTML=({login:()=>auth(),signup:()=>auth(true),dashboard,market,buy:()=>trade(),sell:()=>trade(true),error:()=>trade(false,true),success,wallet,empty:()=>wallet(true),history,ranking,admin,create:()=>stockform(),edit:()=>stockform(true),delete:admin,events,eventform,users,cover,guide,accessibility,coverage}[page]||dashboard)()+(modal?deleteDialog():'');document.title='Mango Trading · '+page;if(document.getElementById('dashcharts')&&window.innerWidth<=800)document.getElementById('dashcharts').style.gridTemplateColumns='1fr';const af=document.getElementById('authform');if(af)af.onsubmit=e=>{e.preventDefault();const password=document.getElementById('password').value,confirm=document.getElementById('password2');let error='';if(!document.getElementById('email').value||!password)error='Informe seu e-mail e sua senha.';else if(confirm&&password.length<8)error='Use pelo menos 8 caracteres na senha deste protótipo.';else if(confirm&&confirm.value!==password)error='As senhas não coincidem.';if(error){let el=document.getElementById('autherror');el.textContent=error;el.classList.remove('hidden')}else go('dashboard')};const tf=document.getElementById('tradeform');if(tf){tf.onsubmit=e=>{e.preventDefault();executeTrade(page==='sell')};document.getElementById('qty').oninput=()=>{const s=stocks.find(s=>s.symbol===selected),q=Number(document.getElementById('qty').value)||0;document.getElementById('tradetotal').textContent=money(q*s.price);document.getElementById('tradebalance').textContent=page!=='sell'&&q*s.price>balance?'—':money(balance+(page==='sell'?1:-1)*q*s.price)}}const search=document.getElementById('search');if(search){const filter=()=>{let n=0;document.querySelectorAll('[data-search]').forEach(r=>{const show=r.dataset.search.includes(search.value.toLowerCase())&&(document.getElementById('sector').value==='Todos os setores'||r.dataset.sector===document.getElementById('sector').value);r.classList.toggle('hidden',!show);if(show)n++});document.getElementById('noresults').classList.toggle('hidden',n>0)};search.oninput=filter;document.getElementById('sector').onchange=filter}const hf=document.getElementById('historytype');if(hf)hf.onchange=()=>{historyFilter=hf.value;render()};const ef=document.getElementById('eventform');if(ef)ef.onsubmit=e=>{e.preventDefault();go('events');toast('Demonstração: formulário validado. Persistência de eventos será implementada.')};document.querySelectorAll('#price,#volatility,#impact').forEach(e=>e.step='0.01');if(modal){const d=document.querySelector('.dialog');d.querySelector('button').focus();d.onkeydown=e=>{const list=[...d.querySelectorAll('button')];if(e.key==='Escape')go('admin');if(e.key==='Tab'){if(e.shiftKey&&document.activeElement===list[0]){e.preventDefault();list.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===list.at(-1)){e.preventDefault();list[0].focus()}}}}}
window.showPage=function(p,afterBuy=false){stocks=structuredClone(initialStocks);balance=4200;portfolio=[{symbol:'AURA3',qty:80,avg:40},{symbol:'NEXO3',qty:66,avg:61},{symbol:'VERD3',qty:20,avg:32}];selected=p==='delete'?'BRIS3':'AURA3';if(afterBuy){balance=3780;portfolio[0]={symbol:'AURA3',qty:90,avg:3620/90};lastTrade={date:'14/09/2026 · 10:32',type:'Compra',symbol:'AURA3',qty:10,price:42};if(transactions[0]?.date!==lastTrade.date)transactions.unshift(lastTrade)}go(p)};
const qp=new URLSearchParams(location.search);page=qp.get('page')||'cover';render();
