<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="1440" height="900" fill="#f5f7f3"/>
<text x="60.00" y="72.35" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="rgb(23, 79, 61)" text-anchor="start" letter-spacing="1.5">MANGO TRADING / GUIA DO PROTÓTIPO</text>
<rect x="1253.96875" y="48" width="126.03125" height="40" rx="8" fill="rgb(232, 241, 235)"/>
<text x="1268.97" y="72.64" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="650" fill="rgb(23, 79, 61)" text-anchor="start">Abrir interface →</text>
<text x="60.00" y="145.34" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="rgb(23, 46, 39)" text-anchor="start" letter-spacing="-1">Uma interface, três perfis de acesso.</text>
<text x="60.00" y="194.60" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="rgb(89, 107, 99)" text-anchor="start">Planejamento visual para a atividade de Entrega do Protótipo (Esqueleto).</text>
<rect x="60" y="224.796875" width="424" height="263.890625" rx="17" fill="rgb(255, 255, 255)"/>
<rect x="85" y="249.796875" width="374" height="28" rx="14" fill="rgb(232, 241, 235)"/>
<text x="96.00" y="268.44" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="rgb(23, 79, 61)" text-anchor="start">Visitante</text>
<text x="85.00" y="321.29" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="rgb(23, 46, 39)" text-anchor="start" letter-spacing="-0.5">Entrar e criar conta</text>
<text x="85.00" y="365.49" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="rgb(23, 46, 39)" text-anchor="start">Cadastro e autenticação. O cadastro público cria apenas</text>
<text x="85.00" y="389.49" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="rgb(23, 46, 39)" text-anchor="start">um perfil de usuário comum.</text>
<rect x="85" y="415.6875" width="374" height="48" rx="10" fill="rgb(232, 241, 235)"/>
<text x="237.92" y="445.20" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="650" fill="rgb(23, 79, 61)" text-anchor="start">Ver acesso</text>
<rect x="508" y="224.796875" width="424" height="263.890625" rx="17" fill="rgb(255, 255, 255)"/>
<rect x="533" y="249.796875" width="374" height="28" rx="14" fill="rgb(232, 241, 235)"/>
<text x="544.00" y="268.44" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="rgb(23, 79, 61)" text-anchor="start">Usuário comum</text>
<text x="533.00" y="321.29" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="rgb(23, 46, 39)" text-anchor="start" letter-spacing="-0.5">Negociar e acompanhar</text>
<text x="533.00" y="365.49" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="rgb(23, 46, 39)" text-anchor="start">Mercado, compra, venda, saldo, carteira, histórico,</text>
<text x="533.00" y="389.49" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="rgb(23, 46, 39)" text-anchor="start">patrimônio e ranking.</text>
<rect x="533" y="415.6875" width="374" height="48" rx="10" fill="rgb(232, 241, 235)"/>
<text x="681.50" y="445.20" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="650" fill="rgb(23, 79, 61)" text-anchor="start">Ver jogador</text>
<rect x="956" y="224.796875" width="424" height="263.890625" rx="17" fill="rgb(255, 255, 255)"/>
<rect x="981" y="249.796875" width="374" height="28" rx="14" fill="rgb(255, 240, 214)"/>
<text x="992.00" y="268.44" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="rgb(123, 74, 0)" text-anchor="start">Administrador</text>
<text x="981.00" y="321.29" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="rgb(23, 46, 39)" text-anchor="start" letter-spacing="-0.5">Gerenciar o mercado</text>
<text x="981.00" y="365.49" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="rgb(23, 46, 39)" text-anchor="start">CRUD de ações e empresas, ativação e desativação,</text>
<text x="981.00" y="389.49" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="rgb(23, 46, 39)" text-anchor="start">eventos e consulta de usuários.</text>
<rect x="981" y="415.6875" width="374" height="48" rx="10" fill="rgb(232, 241, 235)"/>
<text x="1108.78" y="445.20" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="650" fill="rgb(23, 79, 61)" text-anchor="start">Ver administração</text>
<rect x="60" y="512.6875" width="648" height="295.890625" rx="17" fill="rgb(255, 255, 255)"/>
<text x="85.00" y="561.18" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="rgb(23, 46, 39)" text-anchor="start" letter-spacing="-0.5">Fluxos para demonstrar</text>
<text x="85.00" y="605.38" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="rgb(23, 46, 39)" text-anchor="start">Jogador:</text>
<text x="147.31" y="605.38" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="rgb(23, 46, 39)" text-anchor="start"> Entrar → Mercado → Comprar → Confirmação → Carteira → Histórico →</text>
<text x="85.00" y="629.38" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="rgb(23, 46, 39)" text-anchor="start">Ranking.</text>
<text x="85.00" y="673.38" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="rgb(23, 46, 39)" text-anchor="start">CRUD:</text>
<text x="130.13" y="673.38" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="rgb(23, 46, 39)" text-anchor="start"> Listar → Cadastrar → Editar → Excluir → Confirmar → Retornar à listagem.</text>
<text x="85.00" y="717.38" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="rgb(23, 46, 39)" text-anchor="start">Estados:</text>
<text x="142.63" y="717.38" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="rgb(23, 46, 39)" text-anchor="start"> saldo insuficiente, quantidade inválida, ação desativada e carteira vazia.</text>
<rect x="85" y="743.578125" width="75.140625" height="40" rx="8" fill="rgb(232, 241, 235)"/>
<text x="100.00" y="768.22" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="650" fill="rgb(23, 79, 61)" text-anchor="start">Ver erro</text>
<rect x="176.140625" y="743.578125" width="122.0625" height="40" rx="8" fill="rgb(232, 241, 235)"/>
<text x="191.14" y="768.22" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="650" fill="rgb(23, 79, 61)" text-anchor="start">Ver estado vazio</text>
<rect x="732" y="512.6875" width="648" height="295.890625" rx="17" fill="rgb(255, 255, 255)"/>
<text x="757.00" y="561.18" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="rgb(23, 46, 39)" text-anchor="start" letter-spacing="-0.5">Limites desta demonstração</text>
<text x="757.00" y="605.38" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="rgb(23, 46, 39)" text-anchor="start">Protótipo local, com dados fictícios em memória. Formulários e navegação simulam os</text>
<text x="757.00" y="629.38" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="rgb(23, 46, 39)" text-anchor="start">fluxos. Ao recarregar, os dados voltam ao cenário inicial.</text>
<text x="757.00" y="673.38" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="rgb(23, 46, 39)" text-anchor="start">Login, autorização, persistência, ranking dinâmico e motor de preços dependem do back-</text>
<text x="757.00" y="697.38" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="rgb(23, 46, 39)" text-anchor="start">end. O acesso demonstrativo ao administrador não representa a autenticação final.</text>
<text x="757.00" y="741.38" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="rgb(23, 46, 39)" text-anchor="start">O enunciado cita Canva; a ferramenta solicitada pela equipe foi Figma. As imagens</text>
<text x="757.00" y="765.38" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="rgb(23, 46, 39)" text-anchor="start">exportadas podem ser anexadas aos slides e à ERS.</text>
</svg>